services:
  - type: web
    name: wave-barrier-free-gyeongnam
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: TOUR_API_SERVICE_KEY_ENCODED
        sync: false
      - key: KAKAO_MAP_JAVASCRIPT_KEY
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KORAIL_API_KEY
        sync: false
      - key: TAGO_API_KEY
        sync: false
      - key: ODSAY_API_KEY
        sync: false
      - key: EXPRESSWAY_API_KEY
        sync: false

name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      preflight_only:
        description: "Create an unpromoted candidate and inspect its DB read-only; no migration or alias change"
        type: boolean
        default: true
        required: true

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner &&
       (inputs.preflight_only || github.ref == 'refs/heads/main')) ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: 배포할 소스 체크아웃
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: 수동 후보의 동일 SHA CI 성공 확인
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_SHA: ${{ github.sha }}
        run: |
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$DEPLOYMENT_SHA&per_page=1" --jq '.workflow_runs[0].conclusion')"
          test "$conclusion" = success || { echo "Exact-SHA CI success is required before a production-environment candidate."; exit 1; }

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: Vercel 연결 정보 확인
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN secret이 필요합니다."; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "VERCEL_ORG_ID secret이 필요합니다."; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID secret이 필요합니다."; exit 1; }

      - name: 의존성 설치
        run: npm ci

      - name: Vercel 프로젝트 설정 동기화
        run: npx --yes vercel@59.16.0 pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Production Cron secret 보장
        if: ${{ !inputs.preflight_only }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          env_listing="$(npx --yes vercel@59.16.0 env ls production --no-color --scope="$VERCEL_ORG_ID")"
          if printf '%s\n' "$env_listing" | grep -Eq '(^|[[:space:]])CRON_SECRET([[:space:]]|$)'; then
            echo "Vercel Production CRON_SECRET가 이미 설정되어 있습니다."
          else
            cron_secret="$(openssl rand -hex 32)"
            echo "::add-mask::$cron_secret"
            printf '%s' "$cron_secret" | npx --yes vercel@59.16.0 env add CRON_SECRET production --sensitive --scope="$VERCEL_ORG_ID"
            echo "Vercel Production CRON_SECRET를 생성했습니다."
          fi
          # 새로 생성했거나 기존 값을 사용하든 build/deploy가 같은 프로젝트 환경을 읽도록 다시 동기화한다.
          npx --yes vercel@59.16.0 pull --yes --environment=production --scope="$VERCEL_ORG_ID"

      - name: 프로덕션 빌드
        run: npx --yes vercel@59.16.0 build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Migration 일회성 토큰 생성
        id: migration_token
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"

      - name: 승격 전 Production 후보 배포
        id: candidate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          COMMUNITY_MIGRATION_TOKEN: ${{ steps.migration_token.outputs.value }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          url="$(npx --yes vercel@59.16.0 deploy --prebuilt --prod --skip-domain --meta githubCommitSha="$DEPLOYMENT_SHA" --env COMMUNITY_MIGRATION_TOKEN="$COMMUNITY_MIGRATION_TOKEN" | tail -n 1)"
          case "$url" in https://*.vercel.app) ;; *) echo "후보 배포 URL을 확인할 수 없습니다."; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: 후보 health smoke test
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          response="$(npx --yes vercel@59.16.0 curl /api/health --deployment "$CANDIDATE_URL")"
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -Fq '"checkedAt"'

      - name: 운영 DB 대상과 008 영향 읽기 전용 확인
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
          COMMUNITY_MIGRATION_TOKEN: ${{ steps.migration_token.outputs.value }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only || false }}
        run: |
          response="$(npx --yes vercel@59.16.0 curl /api/deployment/migrate --deployment "$CANDIDATE_URL" -X POST -H "Authorization: Bearer $COMMUNITY_MIGRATION_TOKEN" -H "X-Wave-Migration-Mode: inspect")"
          printf '%s' "$response" | node scripts/check-database-preflight.mjs > "$RUNNER_TEMP/database-preflight.json"
          cat "$RUNNER_TEMP/database-preflight.json"
          printf '\nCandidate SHA: %s\nCandidate URL: %s\nPreflight-only: %s\n' "$DEPLOYMENT_SHA" "$CANDIDATE_URL" "$PREFLIGHT_ONLY" >> "$GITHUB_STEP_SUMMARY"
        # Only the trusted typed boolean reaches the summary, never shell code.
        # Secrets and raw provider responses are excluded from the evidence file.

      - name: 비민감 DB 사전 점검 근거 보존
        uses: actions/upload-artifact@v7
        with:
          name: database-preflight
          path: ${{ runner.temp }}/database-preflight.json
          retention-days: 30

      - name: 후보 환경 검증과 커뮤니티 migration
        if: ${{ !inputs.preflight_only }}
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
          COMMUNITY_MIGRATION_TOKEN: ${{ steps.migration_token.outputs.value }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          response="$(npx --yes vercel@59.16.0 curl /api/deployment/migrate --deployment "$CANDIDATE_URL" -X POST -H "Authorization: Bearer $COMMUNITY_MIGRATION_TOKEN")"
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -Fq '"ok":true'
          printf '%s' "$response" | grep -Fq '"001_community.sql"'
          printf '%s' "$response" | grep -Fq '"002_community_moderation.sql"'
          printf '%s' "$response" | grep -Fq '"003_trips.sql"'
          printf '%s' "$response" | grep -Fq '"004_community_seed.sql"'
          printf '%s' "$response" | grep -Fq '"005_community_field_reports.sql"'
          printf '%s' "$response" | grep -Fq '"006_retire_community_seed.sql"'
          printf '%s' "$response" | grep -Fq '"007_account_deletion.sql"'
          printf '%s' "$response" | grep -Fq '"008_review_date_integrity.sql"'

      - name: 프로덕션 승격
        if: ${{ !inputs.preflight_only }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@59.16.0 promote "$CANDIDATE_URL" --yes --scope="$VERCEL_ORG_ID"

      - name: 프로덕션 health와 실패 시 rollback
        if: ${{ !inputs.preflight_only }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if ! curl --fail --silent --show-error --retry 3 --retry-all-errors https://wave-barrier-free-gyeongnam.vercel.app/api/health; then
            npx --yes vercel@59.16.0 rollback --yes --scope="$VERCEL_ORG_ID"
            exit 1
          fi

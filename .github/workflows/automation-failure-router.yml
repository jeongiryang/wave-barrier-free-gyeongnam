name: Automation Failure Router

on:
  workflow_run:
    workflows: ["CI", "CD", "Production API Smoke", "Post-Deploy Production QA"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: automation-failure-router-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  route-failure:
    if: ${{ github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.conclusion != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 실패를 GitHub Issue로 환류
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # actions/github-script@v8
        with:
          script: |
            const run = (await github.rest.actions.getWorkflowRun({...context.repo,run_id:context.payload.workflow_run.id})).data;
            const expected = new Map([['CI','.github/workflows/ci.yml'],['CD','.github/workflows/cd.yml'],['Production API Smoke','.github/workflows/production-api-smoke.yml'],['Post-Deploy Production QA','.github/workflows/automation-post-deploy-qa.yml']]);
            if (expected.get(run.name) !== run.path || run.repository.full_name !== context.payload.repository.full_name || ['success', 'skipped'].includes(run.conclusion)) return;
            if (['Production API Smoke', 'Post-Deploy Production QA'].includes(run.name) && run.head_branch === 'main' && run.head_repository?.full_name === context.payload.repository.full_name && !run.pull_requests?.length) {
              // Trust job/step conclusions from the verified internal workflow,
              // never arbitrary logs, Issue text, a fork artifact or an API message.
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:run.id,filter:'latest',per_page:100});
              const failed = jobs.filter(job => !['success','skipped'].includes(job.conclusion));
              const allowed = new Set(['Provider hold preflight','Production 화면·API 실응답 확인','Production API·화면 실응답 검사']);
              const holdOnly = failed.length === 1 && failed[0].name === 'verify'
                && failed[0].conclusion === 'failure'
                && failed[0].steps?.some(step => step.conclusion === 'failure' && allowed.has(step.name))
                && failed[0].steps.every(step => ['success','skipped'].includes(step.conclusion) || (step.conclusion === 'failure' && allowed.has(step.name)));
              if (holdOnly && jobs.some(job => job.name === 'provider-hold' && job.conclusion === 'success')) {
                core.info('BLOCKED_EXTERNAL: durable provider hold recorded; no code-fix Issue or repeated receipt. Full smoke remains failed.');
                return;
              }
            }
            const scope = run.pull_requests?.[0]?.number ? 'pr-'+run.pull_requests[0].number : 'branch-'+String(run.head_branch).replace(/[^a-zA-Z0-9/_-]/g,'_');
            const receipt = '<!-- wave-failure-run:'+run.id+':'+run.run_attempt+' -->';
            const marker = `<!-- wave-automation-failure:${run.name}:${scope} -->`;
            const title = `[Automation][${run.name}][${scope}] workflow failure`;
            const occurredAt = run.updated_at || run.created_at || new Date().toISOString();
            const details = [
              marker,
              receipt,
              "## 자동 감지된 workflow 실패",
              "",
              `- Workflow: **${run.name}**`,
              `- Conclusion: **${run.conclusion || "unknown"}**`,
              `- Event: \`${run.event || "unknown"}\``,
              `- Branch: \`${run.head_branch || "unknown"}\``,
              `- SHA: \`${run.head_sha || "unknown"}\``,
              `- 발생/갱신 시각: ${occurredAt}`,
              `- Run: ${run.html_url}`,
              "",
              "이 Issue는 GitHub Actions가 자동 생성/갱신했습니다.",
              "Secret 또는 전체 로그 원문은 복제하지 않습니다. 원인 분석은 Run 링크와 저장소 상태를 기준으로 수행하세요.",
              "",
              "### 다음 처리",
              "1. PM/QA가 실패가 실제 Release 영향이 있는지 triage",
              "2. 코드 수정이 필요하면 Engineering queue로 전달",
              "3. 수정 PR의 최신 CI와 Production 영향 검증",
              "4. 성공한 단일 재실행만으로 이 Issue를 자동 종료하지 않음",
            ].join("\n");

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: "open",
              labels: "bug",
              per_page: 100,
            });

            const existing = openIssues.find((issue) =>
              !issue.pull_request &&
              issue.user?.login === "github-actions[bot]" &&
              issue.title === title &&
              (issue.body || "").includes(marker)
            );

            if (existing) {
              const comments = await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:existing.number,per_page:100});
              if ((existing.body || '').includes(receipt) || comments.some(c=>c.user?.login === 'github-actions[bot]' && (c.body || '').includes(receipt))) return;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: [
                  receipt,
                  "## 반복 실패 감지",
                  "",
                  `- Conclusion: **${run.conclusion || "unknown"}**`,
                  `- Branch: \`${run.head_branch || "unknown"}\``,
                  `- SHA: \`${run.head_sha || "unknown"}\``,
                  `- 시각: ${occurredAt}`,
                  `- Run: ${run.html_url}`,
                ].join("\n"),
              });
              core.info(`기존 Issue #${existing.number}에 반복 실패를 기록했습니다.`);
              return;
            }

            const created = await github.rest.issues.create({
              ...context.repo,
              title,
              body: details,
              labels: ["bug"],
              assignees: ["jeongiryang"],
            });

            core.info(`Issue #${created.data.number}를 생성했습니다.`);

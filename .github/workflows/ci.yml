name: CI
'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches:
      - main
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      specs: ${{ steps.plan.outputs.specs }}
    steps:
      - name: Reviewed base policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Select conservative feedback gate
        id: plan
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const file = process.env.GITHUB_WORKSPACE + '/.github/automation/ci-impact.cjs';
            if (!require('node:fs').existsSync(file)) {
              core.setOutput('mode', 'full');
              core.setOutput('specs', '[]');
              core.info('Reviewed base has no impact policy: complete Full gate required.');
            } else {
              await require(file).plan({github,context,core});
            }
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - name: 의존성 설치
        run: npm ci
      - name: Workflow YAML, expressions and shell static checks
        shell: bash
        run: >-
          set -euo pipefail

          curl --fail --silent --show-error --location
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o
          "$RUNNER_TEMP/actionlint.tar.gz"

          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum
          --check

          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint

          "$RUNNER_TEMP/actionlint" -oneline
      - name: 운영 의존성 보안 감사
        run: npm audit --omit=dev --audit-level=high


      - name: 전체 개발 도구 보안 감사
        run: npm audit --audit-level=moderate



      - name: 정적 검사
        run: npm run lint
      - name: 타입 검사
        run: npm run typecheck
      - name: 회귀 테스트
        run: npm test

      - name: Vercel용 빌드 검사
        run: npm run build:vercel

      - name: 빌드 성능 예산 검사
        run: npm run check:performance

  browser:
    needs: impact
    if: ${{ needs.impact.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 브라우저·접근성 회귀 테스트
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2

      - name: 브라우저 검증 보고서 보관
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-regression-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: 화면 캡처와 오류 문맥 보관
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-screenshots-${{ matrix.shard }}
          path: |
            test-results/**/*.png
            test-results/**/*.md
            test-results/**/trace.zip
          retention-days: 7
          if-no-files-found: ignore

  fast-browser:
    needs: impact
    if: ${{ needs.impact.outputs.mode == 'fast' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - name: 의존성 설치
        run: npm ci
      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 변경 영향 브라우저·접근성 검사
        env:
          CI_SELECTED_SPECS: ${{ needs.impact.outputs.specs }}
          FAST_SHARD: ${{ matrix.shard }}
        run: |
          node --input-type=module - <<'JS'
          import {spawnSync} from 'node:child_process';
          const specs = JSON.parse(process.env.CI_SELECTED_SPECS);
          if (!Array.isArray(specs) || !specs.length || specs.length > 100 ||
              new Set(specs).size !== specs.length ||
              specs.some(file => typeof file !== 'string' || !/^e2e\/[a-z0-9-]+\.spec\.ts$/.test(file)) ||
              !['1','2'].includes(process.env.FAST_SHARD)) throw Error('Invalid reviewed test selection');
          const result = spawnSync(process.execPath, ['node_modules/@playwright/test/cli.js', 'test', ...specs, '--shard=' + process.env.FAST_SHARD + '/2'], {stdio:'inherit'});
          process.exit(result.status ?? 1);
          JS
      - name: Fast browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: fast-browser-regression-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Fast screenshots and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: fast-browser-screenshots-${{ matrix.shard }}
          path: |
            test-results/**/*.png
            test-results/**/*.md
            test-results/**/trace.zip
          retention-days: 7
          if-no-files-found: ignore

  # Fast never creates a skipped/successful protected validate check. This job
  # always evaluates the selected complete dependency set and rejects missing data.
  validate:
    name: ${{ needs.impact.outputs.mode == 'fast' && 'fast-pr-gate' || 'validate' }}
    if: ${{ always() }}
    needs: [quality, browser, sandbox-boundary, impact, fast-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 모든 검증 결과 확인
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.impact.outputs.mode == 'fast' && needs.fast-browser.result || needs.browser.result }}
          BOUNDARY_RESULT: ${{ needs.sandbox-boundary.result }}
        run: node -e 'if ([process.env.QUALITY_RESULT, process.env.BROWSER_RESULT, process.env.BOUNDARY_RESULT].some(result => result !== "success")) process.exit(1)'
      - name: Reject incomplete selection or duplicate browser execution
        env:
          CI_MODE: ${{ needs.impact.outputs.mode }}
          IMPACT_RESULT: ${{ needs.impact.result }}
          UNSELECTED_BROWSER_RESULT: ${{ needs.impact.outputs.mode == 'fast' && needs.browser.result || needs.fast-browser.result }}
        run: node -e 'if (process.env.IMPACT_RESULT !== "success" || !["fast", "full"].includes(process.env.CI_MODE) || process.env.UNSELECTED_BROWSER_RESULT !== "skipped") process.exit(1)'

  # Owner-approved RC scope: frozen boundary plus its existing bounded synthetic
  # npm smoke. Full product/browser coverage remains in quality + browser above.
  # Historical four-shard runtime is preserved outside the workflows directory.
  sandbox-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
      - name: Verify immutable CI bootstrap before candidate execution
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/jeongiryang/wave-barrier-free-gyeongnam/51e3331334713cdc52a3b57e25d8de84df443783/scripts/subscription-ci-bootstrap.py \
            -o "$RUNNER_TEMP/wave-ci-bootstrap.py"
          printf 'e8b16c37b3f41d75ba19385452b5b7d84694aa2b2728cf528dfa61e4a7078749  %s\n' "$RUNNER_TEMP/wave-ci-bootstrap.py" | sha256sum --check
          python3 -I -B "$RUNNER_TEMP/wave-ci-bootstrap.py" --repository "$GITHUB_WORKSPACE" --destination "$RUNNER_TEMP/wave-trusted"
          cp "$RUNNER_TEMP/wave-ci-bootstrap.py" "$RUNNER_TEMP/wave-trusted/scripts/subscription-ci-bootstrap.py"
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/jeongiryang/wave-barrier-free-gyeongnam/abadeffe18f0ec9699d3f6b33cd5737620122d6f/tests/subscription-ci-bootstrap-boundary.py \
            -o "$RUNNER_TEMP/wave-trusted/tests/subscription-ci-bootstrap-boundary.py"
          printf 'df6ed9c7528e7f09da42b1c477e81621d36b27f6ee006315fab70d9dac8c7f9f  %s\n' "$RUNNER_TEMP/wave-trusted/tests/subscription-ci-bootstrap-boundary.py" | sha256sum --check
          python3 -I -B "$RUNNER_TEMP/wave-trusted/tests/subscription-ci-bootstrap-boundary.py"
      - name: Reject tampered bootstrap before any checkout code executes
        run: python3 -I "$RUNNER_TEMP/wave-trusted/tests/subscription-bootstrap-boundary.py"
      - name: Actual validation sandbox boundary
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap apparmor
          # Noble's runner lacks this profile. Load the pinned AppArmor upstream
          # bwrap/child policy, never disable global AppArmor/userns restrictions.
          curl --fail --silent --show-error --location \
            https://gitlab.com/apparmor/apparmor/-/raw/8e431ebcd915216a03ebc8d01e72b1741bb2f855/profiles/apparmor/profiles/extras/bwrap-userns-restrict \
            -o "$RUNNER_TEMP/bwrap-userns-restrict"
          printf '634d3d3427c483f123cb5ed53b71ea13040187e07d9f67ca74421d42a6170f0e  %s\n' "$RUNNER_TEMP/bwrap-userns-restrict" | sha256sum --check
          sudo apparmor_parser -r "$RUNNER_TEMP/bwrap-userns-restrict"
          # Dedicated trusted quota owner; keep global restrictions and the
          # distro bwrap profile. Inner kernel caps/userns limits are tested.
          sudo install -m 0755 -D /usr/bin/bwrap /opt/wave-quota/bwrap
          # Immutable reviewed policy; never give a checkout file to root parser.
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/jeongiryang/wave-barrier-free-gyeongnam/a0f3af0820d4924042b98a06b09b36a41d0c74b9/.github/security/quota-owner.apparmor \
            -o "$RUNNER_TEMP/quota-owner.apparmor"
          printf '5569873ac76c043f90aa14292b77109177b30d3b5c2f90fa28fa0b91a6688b35  %s\n' "$RUNNER_TEMP/quota-owner.apparmor" | sha256sum --check
          sudo apparmor_parser -r "$RUNNER_TEMP/quota-owner.apparmor"
          runtime="$(node -p 'require("node:path").dirname(require("node:path").dirname(process.execPath))')"
          sudo systemd-run --quiet --wait --pipe --collect --uid="$(id -u)" --gid="$(id -g)" \
            --working-directory="$PWD" --setenv="RUNNER_TEMP=$RUNNER_TEMP" --setenv="WAVE_PUBLIC_RUNTIME=$runtime" --setenv="WAVE_TRUSTED_RUNTIME=$RUNNER_TEMP/wave-trusted" \
            --setenv="WAVE_PUBLIC_BROWSERS=$HOME/.cache/ms-playwright" \
            -p MemoryMax=6G -p MemorySwapMax=0 -p TasksMax=1024 -p CPUQuota=200% \
            -p OOMPolicy=kill -p KillMode=control-group -p RuntimeMaxSec=1200 \
            /usr/bin/python3 -I -B - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          runtime = pathlib.Path(os.environ["WAVE_PUBLIC_RUNTIME"])
          browsers = pathlib.Path(os.environ["RUNNER_TEMP"]) / "public-probe-browser-root"
          browsers.mkdir()
          config = {"version": 1, "bwrap": "/usr/bin/bwrap", "quotaBwrap": "/opt/wave-quota/bwrap", "runtime": str(runtime), "browsers": str(browsers), "scratch": os.environ["RUNNER_TEMP"]}
          for key, file in [("bwrapSha256", pathlib.Path("/usr/bin/bwrap")), ("nodeSha256", runtime / "bin/node")]:
              with file.open("rb") as source:
                  config[key] = hashlib.file_digest(source, "sha256").hexdigest()
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "public-sandbox-config.json"
          target.write_text(json.dumps(config))
          subprocess.run(["python3", "-I", "-B", str(pathlib.Path(os.environ["WAVE_TRUSTED_RUNTIME"]) / "tests/subscription-sandbox-boundary.py"), str(target)], check=True)
          PY
      - name: Aggregate process resources and privileged policy tamper probes
        run: python3 -I -B "$RUNNER_TEMP/wave-trusted/tests/subscription-resource-boundary.py"
      - name: Preserve public resource diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: public-resource-boundary
          path: ${{ runner.temp }}/wave-public-resources.json
          retention-days: 7
          if-no-files-found: ignore

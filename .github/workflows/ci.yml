name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 운영 의존성 보안 감사
        run: npm audit --omit=dev --audit-level=high

      - name: 정적 검사
        run: npm run lint

      - name: 타입 검사
        run: npm run typecheck

      - name: 회귀 테스트
        run: npm test

      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 브라우저·접근성 회귀 테스트
        run: npm run test:e2e

      - name: 브라우저 검증 보고서 보관
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-regression
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: 화면 캡처와 오류 문맥 보관
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-screenshots
          path: |
            test-results/**/*.png
            test-results/**/*.md
          retention-days: 7
          if-no-files-found: ignore

      - name: Vercel용 빌드 검사
        run: npm run build:vercel

      - name: 빌드 성능 예산 검사
        run: npm run check:performance

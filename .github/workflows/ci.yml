name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 정적 검사
        run: npm run lint

      - name: 타입 검사
        run: npm run typecheck

      - name: 회귀 테스트
        run: npm test

      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: README용 Production 화면 캡처
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/212-readme-demo'
        env:
          README_SCREENSHOT_LOG_BASE64: "1"
        run: npm run capture:readme

      - name: 브라우저·접근성 회귀 테스트
        run: npm run test:e2e

      - name: Vercel용 빌드 검사
        run: npm run build:vercel

# September delivery: quick critical journeys, not final feature certification.
name: CI
'on':
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 의존성 설치
        run: npm ci --no-audit --no-fund
      - name: Release feature and quick-suite contract
        run: npm run harness -- check
      - name: Workflow YAML, expressions and shell static checks
        shell: bash
        run: >-
          set -euo pipefail

          curl --fail --silent --show-error --location
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o
          "$RUNNER_TEMP/actionlint.tar.gz"

          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum
          --check

          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint

          "$RUNNER_TEMP/actionlint" -oneline
      - name: 운영 의존성 보안 감사
        run: npm audit --omit=dev --audit-level=high
      - name: 전체 개발 도구 보안 감사
        run: npm audit --audit-level=moderate
      - name: 정적 검사
        run: npm run lint
      - name: 타입 검사
        run: npm run typecheck
      - name: 회귀 테스트
        run: npm test
      - name: Vercel용 빌드 검사
        run: npm run build:vercel
      - name: 빌드 성능 예산 검사
        run: npm run check:performance
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
        device:
          - desktop
          - mobile
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 의존성 설치
        run: npm ci --no-audit --no-fund
      - name: 브라우저 설치
        run: |
          # Restore the runner image's Chrome-repository exclusion. Chromium and
          # its Ubuntu dependencies do not use Google's independently updated APT index.
          for source in /etc/apt/sources.list.d/google-chrome{,-stable}.{list,sources}; do
            if [[ -f "$source" ]] && grep -Eq 'https?://dl\.google\.com/linux/chrome(-stable)?/deb/?([[:space:]]|$)' "$source"; then
              echo "Quarantining unused Chrome APT source: $source"
              sudo mv -- "$source" "$RUNNER_TEMP/$(basename "$source").wave-disabled"
            fi
          done
          npx playwright install --with-deps chromium
      - name: 브라우저·접근성 회귀 테스트
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/${{ matrix.device }}
        run: >-
          npm run test:e2e:quick -- --project=${{ matrix.device }}-chromium --shard=${{ matrix.shard }}/2 --output=test-results/${{
          matrix.device }}
      - name: 브라우저 검증 보고서 보관
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-regression-${{ matrix.device }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: 화면 캡처와 오류 문맥 보관
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-screenshots-${{ matrix.device }}-${{ matrix.shard }}
          path: |
            test-results/**/*.png
            test-results/**/*.md
            test-results/**/trace.zip
          retention-days: 7
          if-no-files-found: ignore
  validate:
    if: ${{ always() }}
    needs:
      - quality
      - browser
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every quality and browser result
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: node -e 'if(process.env.QUALITY_RESULT!=="success"||process.env.BROWSER_RESULT!=="success")process.exit(1)'

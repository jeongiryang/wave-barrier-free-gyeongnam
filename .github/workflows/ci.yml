name: CI
'on':
  pull_request: null
  push:
    branches:
      - main
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - name: 의존성 설치
        run: npm ci
      - name: Workflow YAML, expressions and shell static checks
        shell: bash
        run: >-
          set -euo pipefail

          curl --fail --silent --show-error --location
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o
          "$RUNNER_TEMP/actionlint.tar.gz"

          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum
          --check

          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint

          "$RUNNER_TEMP/actionlint" -oneline
      - name: 운영 의존성 보안 감사
        run: npm audit --omit=dev --audit-level=high
      - name: 정적 검사
        run: npm run lint
      - name: 타입 검사
        run: npm run typecheck
      - name: 회귀 테스트
        run: npm test
      - name: Actual validation sandbox boundary
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap apparmor
          # Load Ubuntu's scoped bwrap profile, including its capability-stripping
          # child profile. Never disable AppArmor or the global userns restriction.
          test -f /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          runtime = pathlib.Path(subprocess.check_output(["node", "-p", "process.execPath"], text=True).strip()).parent.parent
          browsers = pathlib.Path(os.environ["RUNNER_TEMP"]) / "public-probe-browser-root"
          browsers.mkdir()
          config = {"version": 1, "bwrap": "/usr/bin/bwrap", "runtime": str(runtime), "browsers": str(browsers), "scratch": os.environ["RUNNER_TEMP"]}
          for key, file in [("bwrapSha256", pathlib.Path("/usr/bin/bwrap")), ("nodeSha256", runtime / "bin/node")]:
              with file.open("rb") as source:
                  config[key] = hashlib.file_digest(source, "sha256").hexdigest()
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "public-sandbox-config.json"
          target.write_text(json.dumps(config))
          subprocess.run(["python3", "tests/subscription-sandbox-boundary.py", str(target)], check=True)
          PY
      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 브라우저·접근성 회귀 테스트
        run: npm run test:e2e
      - name: 브라우저 검증 보고서 보관
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-regression
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: 화면 캡처와 오류 문맥 보관
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-screenshots
          path: |
            test-results/**/*.png
            test-results/**/*.md
          retention-days: 7
          if-no-files-found: ignore
      - name: Vercel용 빌드 검사
        run: npm run build:vercel
      - name: 빌드 성능 예산 검사
        run: npm run check:performance

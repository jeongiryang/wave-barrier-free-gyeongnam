name: CI
'on':
  pull_request: null
  push:
    branches:
      - main
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - name: 의존성 설치
        run: npm ci
      - name: Workflow YAML, expressions and shell static checks
        shell: bash
        run: >-
          set -euo pipefail

          curl --fail --silent --show-error --location
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o
          "$RUNNER_TEMP/actionlint.tar.gz"

          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum
          --check

          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint

          "$RUNNER_TEMP/actionlint" -oneline
      - name: 운영 의존성 보안 감사
        run: npm audit --omit=dev --audit-level=high
      - name: 정적 검사
        run: npm run lint
      - name: 타입 검사
        run: npm run typecheck
      - name: 회귀 테스트
        run: npm test
      - name: Reject tampered bootstrap before any checkout code executes
        run: python3 -I tests/subscription-bootstrap-boundary.py
      - name: Actual validation sandbox boundary
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap apparmor
          # Noble's runner lacks this profile. Load the pinned AppArmor upstream
          # bwrap/child policy, never disable global AppArmor/userns restrictions.
          curl --fail --silent --show-error --location \
            https://gitlab.com/apparmor/apparmor/-/raw/8e431ebcd915216a03ebc8d01e72b1741bb2f855/profiles/apparmor/profiles/extras/bwrap-userns-restrict \
            -o "$RUNNER_TEMP/bwrap-userns-restrict"
          printf '634d3d3427c483f123cb5ed53b71ea13040187e07d9f67ca74421d42a6170f0e  %s\n' "$RUNNER_TEMP/bwrap-userns-restrict" | sha256sum --check
          sudo apparmor_parser -r "$RUNNER_TEMP/bwrap-userns-restrict"
          # Dedicated trusted quota owner; keep global restrictions and the
          # distro bwrap profile. Inner kernel caps/userns limits are tested.
          sudo install -m 0755 -D /usr/bin/bwrap /opt/wave-quota/bwrap
          # Immutable reviewed policy; never give a checkout file to root parser.
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/jeongiryang/wave-barrier-free-gyeongnam/a0f3af0820d4924042b98a06b09b36a41d0c74b9/.github/security/quota-owner.apparmor \
            -o "$RUNNER_TEMP/quota-owner.apparmor"
          printf '5569873ac76c043f90aa14292b77109177b30d3b5c2f90fa28fa0b91a6688b35  %s\n' "$RUNNER_TEMP/quota-owner.apparmor" | sha256sum --check
          sudo apparmor_parser -r "$RUNNER_TEMP/quota-owner.apparmor"
          runtime="$(node -p 'require("node:path").dirname(require("node:path").dirname(process.execPath))')"
          sudo systemd-run --quiet --wait --pipe --collect --uid="$(id -u)" --gid="$(id -g)" \
            --working-directory="$PWD" --setenv="RUNNER_TEMP=$RUNNER_TEMP" --setenv="WAVE_PUBLIC_RUNTIME=$runtime" \
            --setenv="WAVE_PUBLIC_BROWSERS=$HOME/.cache/ms-playwright" \
            -p MemoryMax=6G -p MemorySwapMax=0 -p TasksMax=1024 -p CPUQuota=200% \
            -p OOMPolicy=kill -p KillMode=control-group -p RuntimeMaxSec=1200 \
            /usr/bin/python3 -I -B - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          runtime = pathlib.Path(os.environ["WAVE_PUBLIC_RUNTIME"])
          browsers = pathlib.Path(os.environ["RUNNER_TEMP"]) / "public-probe-browser-root"
          browsers.mkdir()
          config = {"version": 1, "bwrap": "/usr/bin/bwrap", "quotaBwrap": "/opt/wave-quota/bwrap", "runtime": str(runtime), "browsers": str(browsers), "scratch": os.environ["RUNNER_TEMP"]}
          for key, file in [("bwrapSha256", pathlib.Path("/usr/bin/bwrap")), ("nodeSha256", runtime / "bin/node")]:
              with file.open("rb") as source:
                  config[key] = hashlib.file_digest(source, "sha256").hexdigest()
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "public-sandbox-config.json"
          target.write_text(json.dumps(config))
          subprocess.run(["python3", "tests/subscription-sandbox-boundary.py", str(target)], check=True)
          PY
      - name: Aggregate process resources and privileged policy tamper probes
        run: python3 -I -B tests/subscription-resource-boundary.py
      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 브라우저·접근성 회귀 테스트
        run: npm run test:e2e
      - name: 브라우저 검증 보고서 보관
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-regression
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: 화면 캡처와 오류 문맥 보관
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-screenshots
          path: |
            test-results/**/*.png
            test-results/**/*.md
          retention-days: 7
          if-no-files-found: ignore
      - name: Vercel용 빌드 검사
        run: npm run build:vercel
      - name: 빌드 성능 예산 검사
        run: npm run check:performance
  sandbox-application:
    name: Full application inside validation sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - name: Prepare public dependencies and Chromium on disposable CI runner
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Run every application check inside the actual boundary
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap apparmor
          curl --fail --silent --show-error --location \
            https://gitlab.com/apparmor/apparmor/-/raw/8e431ebcd915216a03ebc8d01e72b1741bb2f855/profiles/apparmor/profiles/extras/bwrap-userns-restrict \
            -o "$RUNNER_TEMP/bwrap-userns-restrict"
          printf '634d3d3427c483f123cb5ed53b71ea13040187e07d9f67ca74421d42a6170f0e  %s\n' "$RUNNER_TEMP/bwrap-userns-restrict" | sha256sum --check
          sudo apparmor_parser -r "$RUNNER_TEMP/bwrap-userns-restrict"
          sudo install -m 0755 -D /usr/bin/bwrap /opt/wave-quota/bwrap
          # Immutable reviewed policy; never give a checkout file to root parser.
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/jeongiryang/wave-barrier-free-gyeongnam/a0f3af0820d4924042b98a06b09b36a41d0c74b9/.github/security/quota-owner.apparmor \
            -o "$RUNNER_TEMP/quota-owner.apparmor"
          printf '5569873ac76c043f90aa14292b77109177b30d3b5c2f90fa28fa0b91a6688b35  %s\n' "$RUNNER_TEMP/quota-owner.apparmor" | sha256sum --check
          sudo apparmor_parser -r "$RUNNER_TEMP/quota-owner.apparmor"
          runtime="$(node -p 'require("node:path").dirname(require("node:path").dirname(process.execPath))')"
          sudo systemd-run --quiet --wait --pipe --collect --uid="$(id -u)" --gid="$(id -g)" \
            --working-directory="$PWD" --setenv="RUNNER_TEMP=$RUNNER_TEMP" --setenv="WAVE_PUBLIC_RUNTIME=$runtime" \
            --setenv="WAVE_PUBLIC_BROWSERS=$HOME/.cache/ms-playwright" \
            -p MemoryMax=6G -p MemorySwapMax=0 -p TasksMax=1024 -p CPUQuota=200% \
            -p OOMPolicy=kill -p KillMode=control-group -p RuntimeMaxSec=1200 \
            /usr/bin/python3 -I -B - <<'PY'
          import hashlib, importlib.util, os, pathlib, subprocess
          runtime = pathlib.Path(os.environ["WAVE_PUBLIC_RUNTIME"])
          config = {"version": 1, "bwrap": "/usr/bin/bwrap", "quotaBwrap": "/opt/wave-quota/bwrap", "runtime": str(runtime), "browsers": str(pathlib.Path(os.environ["WAVE_PUBLIC_BROWSERS"]).resolve()), "scratch": os.environ["RUNNER_TEMP"]}
          for key, file in [("bwrapSha256", pathlib.Path("/usr/bin/bwrap")), ("nodeSha256", runtime / "bin/node")]:
              with file.open("rb") as source:
                  config[key] = hashlib.file_digest(source, "sha256").hexdigest()
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "public-source.tar"
          with archive.open("wb") as target:
              subprocess.run(["git", "-c", "core.hooksPath=/dev/null", "archive", "HEAD"], stdout=target, check=True)
          spec = importlib.util.spec_from_file_location("boundary", "scripts/subscription-sandbox.py")
          boundary = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(boundary)
          boundary.probe(config)
          checks = boundary.validate(config, str(archive), {})
          assert len(checks) == 6
          print("PASS: all six application checks inside linux-bwrap-v1")
          PY
      - name: Preserve credential-free sandbox command logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: sandbox-application-logs
          path: |
            ${{ runner.temp }}/wave-validation-*.log
            ${{ runner.temp }}/wave-validation-*-artifacts/
          retention-days: 7
          if-no-files-found: ignore

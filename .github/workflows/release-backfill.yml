name: Release Backfill

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 백필 전용 토큰 확인
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: test -n "$RELEASE_GITHUB_TOKEN" || { echo "RELEASE_GITHUB_TOKEN secret이 필요합니다."; exit 1; }
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: PR별 태그와 릴리즈 생성
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: node scripts/backfill-releases.mjs

name: Issue triage

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  label-and-assign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 담당자와 기본 라벨 지정
        uses: actions/github-script@v8
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        with:
          script: |
            const title = (process.env.ISSUE_TITLE || "").toLowerCase();
            let labels = ["enhancement"];

            if (/bug|fix|오류|버그|장애|보안|security/.test(title)) {
              labels = ["bug"];
            } else if (/docs?|문서|readme|가이드/.test(title)) {
              labels = ["documentation"];
            }

            await github.rest.issues.addAssignees({
              ...context.repo,
              issue_number: context.issue.number,
              assignees: ["jeongiryang"],
            });
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels,
            });

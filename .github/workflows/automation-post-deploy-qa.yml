name: Post-Deploy Production QA

on:
  workflow_run:
    workflows: ["CD"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: post-deploy-production-qa
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: 배포된 commit 체크아웃
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Production API·화면 실응답 검사
        run: npm run check:production

      - name: Production browser smoke용 Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: 읽기 전용 Production 사용자 여정·접근성 smoke
        env:
          E2E_BASE_URL: https://wave-barrier-free-gyeongnam.vercel.app
        run: npx playwright test --config=playwright.production.config.ts

      - name: Production QA 증거 보관
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: post-deploy-production-qa-${{ github.event.workflow_run.head_sha }}
          path: |
            playwright-production-report/
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.md
          retention-days: 14
          if-no-files-found: ignore

  notify-pm:
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: PM Workspace Agent에 Production PASS handoff
        env:
          AGENT_TRIGGER_ID: ${{ secrets.WAVE_PM_AGENT_TRIGGER_ID }}
          AGENT_ACCESS_TOKEN: ${{ secrets.WAVE_PM_AGENT_ACCESS_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          CD_RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$AGENT_TRIGGER_ID" || -z "$AGENT_ACCESS_TOKEN" ]]; then
            echo "PM Workspace Agent 미설정: Production QA PASS는 GitHub Actions에 기록하고 종료합니다."
            exit 0
          fi

          input="Post-deploy Production QA PASSED for ${REPOSITORY} commit ${DEPLOYED_SHA}. The upstream CD run is ${CD_RUN_URL}. The read-only Production QA ran npm run check:production plus desktop/mobile Playwright smoke against the real Production URL, including health, landing-to-planner entry, public planner/travel-book/community rendering, page-level horizontal overflow, serious/critical axe violations, page errors, and reduced-motion entry. Read the GitHub workflow evidence directly. As PM Assistant/Orchestrator, update GitHub release/compliance handoff state where appropriate and synchronize the Notion W.A.V.E Control Center. Do not declare Release GO or final competition readiness unless every required automated, compliance, and human gate is independently satisfied. jeongiryang remains the actual PM and Release Authority."
          payload="$(jq -n --arg conversation_key "wave-production-${DEPLOYED_SHA}" --arg input "$input" '{conversation_key:$conversation_key,input:$input}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.chatgpt.com/v1/workspace_agents/${AGENT_TRIGGER_ID}/trigger" \
            --header "Authorization: Bearer ${AGENT_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --header "Idempotency-Key: production-pass-${GITHUB_RUN_ID}" \
            --data "$payload" >/dev/null

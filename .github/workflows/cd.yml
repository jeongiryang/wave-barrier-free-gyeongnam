name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: 배포할 소스 체크아웃
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: Vercel 연결 정보 확인
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN secret이 필요합니다."; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "VERCEL_ORG_ID secret이 필요합니다."; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID secret이 필요합니다."; exit 1; }

      - name: 의존성 설치
        run: npm ci

      - name: Vercel 프로젝트 설정 동기화
        run: npx --yes vercel@50.15.1 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Production Cron secret 보장
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          env_listing="$(npx --yes vercel@50.15.1 env ls production --no-color --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN")"
          if printf '%s\n' "$env_listing" | grep -Eq '(^|[[:space:]])CRON_SECRET([[:space:]]|$)'; then
            echo "Vercel Production CRON_SECRET가 이미 설정되어 있습니다."
          else
            cron_secret="$(openssl rand -hex 32)"
            echo "::add-mask::$cron_secret"
            printf '%s\n' "$cron_secret" | npx --yes vercel@50.15.1 env add CRON_SECRET production --sensitive --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
            echo "Vercel Production CRON_SECRET를 생성했습니다."
          fi
          # 새로 생성했거나 기존 값을 사용하든 build/deploy가 같은 프로젝트 환경을 읽도록 다시 동기화한다.
          npx --yes vercel@50.15.1 pull --yes --environment=production --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"

      - name: 프로덕션 빌드
        run: npx --yes vercel@50.15.1 build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Migration 일회성 토큰 생성
        id: migration_token
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"

      - name: 승격 전 Production 후보 배포
        id: candidate
        env:
          COMMUNITY_MIGRATION_TOKEN: ${{ steps.migration_token.outputs.value }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url="$(npx --yes vercel@50.15.1 deploy --prebuilt --prod --skip-domain --env COMMUNITY_MIGRATION_TOKEN="$COMMUNITY_MIGRATION_TOKEN" --token="${{ secrets.VERCEL_TOKEN }}" | tail -n 1)"
          case "$url" in https://*.vercel.app) ;; *) echo "후보 배포 URL을 확인할 수 없습니다."; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: 후보 health smoke test
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          response="$(npx --yes vercel@54.14.0 curl /api/health --deployment "$CANDIDATE_URL")"
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -Fq '"checkedAt"'

      - name: 후보 환경 검증과 커뮤니티 migration
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
          COMMUNITY_MIGRATION_TOKEN: ${{ steps.migration_token.outputs.value }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          response="$(npx --yes vercel@54.14.0 curl /api/deployment/migrate --deployment "$CANDIDATE_URL" -X POST -H "Authorization: Bearer $COMMUNITY_MIGRATION_TOKEN")"
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -Fq '"ok":true'
          printf '%s' "$response" | grep -Fq '"001_community.sql"'
          printf '%s' "$response" | grep -Fq '"002_community_moderation.sql"'
          printf '%s' "$response" | grep -Fq '"003_trips.sql"'
          printf '%s' "$response" | grep -Fq '"004_community_seed.sql"'
          printf '%s' "$response" | grep -Fq '"005_community_field_reports.sql"'
          printf '%s' "$response" | grep -Fq '"006_retire_community_seed.sql"'
          printf '%s' "$response" | grep -Fq '"007_account_deletion.sql"'
          printf '%s' "$response" | grep -Fq '"008_review_date_integrity.sql"'

      - name: 프로덕션 승격
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@50.15.1 promote "$CANDIDATE_URL" --yes --scope="$VERCEL_ORG_ID" --token="${{ secrets.VERCEL_TOKEN }}"

      - name: 프로덕션 health와 실패 시 rollback
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if ! curl --fail --silent --show-error --retry 3 --retry-all-errors https://wave-barrier-free-gyeongnam.vercel.app/api/health; then
            npx --yes vercel@50.15.1 rollback --yes --scope="$VERCEL_ORG_ID" --token="${{ secrets.VERCEL_TOKEN }}"
            exit 1
          fi

name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - name: 배포할 소스 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Vercel 연결 정보 확인
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN secret이 필요합니다."; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "VERCEL_ORG_ID secret이 필요합니다."; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID secret이 필요합니다."; exit 1; }

      - name: 의존성 설치
        run: npm ci

      - name: Vercel 프로젝트 설정 동기화
        run: npx --yes vercel@50.15.1 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 프로덕션 빌드
        run: npx --yes vercel@50.15.1 build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Migration 일회성 토큰 생성
        id: migration_token
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"

      - name: 승격 전 Production 후보 배포
        id: candidate
        env:
          COMMUNITY_MIGRATION_TOKEN: ${{ steps.migration_token.outputs.value }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url="$(npx --yes vercel@50.15.1 deploy --prebuilt --prod --skip-domain --env COMMUNITY_MIGRATION_TOKEN="$COMMUNITY_MIGRATION_TOKEN" --token="${{ secrets.VERCEL_TOKEN }}" | tail -n 1)"
          case "$url" in https://*.vercel.app) ;; *) echo "후보 배포 URL을 확인할 수 없습니다."; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: 후보 환경 검증과 커뮤니티 migration
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
          COMMUNITY_MIGRATION_TOKEN: ${{ steps.migration_token.outputs.value }}
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors --request POST --header "Authorization: Bearer $COMMUNITY_MIGRATION_TOKEN" "$CANDIDATE_URL/api/deployment/migrate"

      - name: 후보 health smoke test
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors "$CANDIDATE_URL/api/health"

      - name: 프로덕션 승격
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@50.15.1 promote "$CANDIDATE_URL" --yes --token="${{ secrets.VERCEL_TOKEN }}"

      - name: 프로덕션 health와 실패 시 rollback
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if ! curl --fail --silent --show-error --retry 3 --retry-all-errors https://wave-barrier-free-gyeongnam.vercel.app/api/health; then
            npx --yes vercel@50.15.1 rollback --yes --token="${{ secrets.VERCEL_TOKEN }}"
            exit 1
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

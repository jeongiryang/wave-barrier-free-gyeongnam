name: Production API Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: read

concurrency:
  group: production-api-smoke
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7
      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
      - name: Production 화면·API 실응답 확인
        run: npm run check:production

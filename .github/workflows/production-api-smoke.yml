name: Production API Smoke

'on':
  workflow_dispatch:
    inputs:
      preview_url:
        description: Optional immutable Preview origin; empty runs the existing Production API smoke
        type: string
        required: false
      preview_sha:
        description: Exact Preview commit; must equal the dispatched branch HEAD
        type: string
        required: false
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: read

concurrency:
  group: production-provider-smoke
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' && !inputs.preview_url && !inputs.preview_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: read
    outputs:
      provider_block: ${{ steps.hold.outputs.provider_block || steps.api.outputs.provider_block }}
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
      - name: Provider hold preflight
        id: hold
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: await require(process.env.GITHUB_WORKSPACE + '/.github/automation/provider-hold.cjs').preflight({github,context,core});
      - name: Production 화면·API 실응답 확인
        id: api
        run: npm run check:production
      - name: Preserve mixed provider failure for engineering triage
        if: ${{ !cancelled() && steps.api.outputs.provider_engineering == 'true' }}
        run: |
          echo "Mixed provider failure: calls stopped; retain engineering investigation."
          exit 1
      - name: Preserve bounded API evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: production-provider-${{ github.sha }}
          path: provider-smoke-result.json
          retention-days: 14
          if-no-files-found: ignore

  provider-hold:
    if: ${{ !cancelled() && needs.verify.result == 'failure' && needs.verify.outputs.provider_block != '' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record external operation once
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          PROVIDER_BLOCK: ${{ needs.verify.outputs.provider_block }}
        with:
          script: await require(process.env.GITHUB_WORKSPACE + '/.github/automation/provider-hold.cjs').recordHolds({github,context,core},{serialized:process.env.PROVIDER_BLOCK,sha:context.sha,runId:context.runId});

  preview:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.preview_url || inputs.preview_sha) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Exact workflow commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable Preview and SHA before repository execution
        id: preview
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
          PREVIEW_SHA: ${{ inputs.preview_sha }}
        with:
          script: await require(process.env.GITHUB_WORKSPACE + '/.github/automation/check-preview.cjs').checkPreview({github,context,core,url:process.env.PREVIEW_URL,sha:process.env.PREVIEW_SHA});
      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - name: Dependencies
        run: npm ci
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Read-only deployed region lifecycle and delayed-location regression
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
        run: npm run test:e2e -- e2e/region-change-boundary.spec.ts
      - name: Preserve Preview browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: preview-region-${{ github.sha }}
          path: |
            playwright-report/
            test-results/**/*.png
            test-results/**/*.md
            test-results/**/trace.zip
          retention-days: 7
          if-no-files-found: ignore

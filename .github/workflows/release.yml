name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/release-backfill.yml
      - .github/workflows/release.yml
      - scripts/backfill-releases.mjs
      - scripts/release-current.mjs
      - docs/releases.md
      - docs/ai-logs/**

permissions:
  contents: write

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 현재 PR 태그와 릴리즈 생성
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-current.mjs

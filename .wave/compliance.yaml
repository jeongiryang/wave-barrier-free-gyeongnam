material_change_rules:
  always_material:
    - deadline
    - submission_destination
    - required_submission_item
    - official_form
    - judging_criteria
    - disqualification_condition
    - application_category_or_task
    - openapi_usage_policy
    - attribution_policy
    - external_api_or_ai_policy
    - production_url_or_test_account_requirement
    - presentation_or_video_requirement
    - privacy_copyright_or_data_policy
  routing:
    code_impact: agent:pm -> trusted PM handoff -> agent:engineering
    submission_impact: agent:submission
    human_only: status:blocked-human + agent:human + human-gate
    external_dependency: status:blocked-external + agent:pm
    no_material_change: audit only + Notion sync
truth_policy:
  authoritative_source_precedence:
    - newer_official_correction
    - official_operator_email_or_notice
    - official_competition_notion_or_form
    - direct_kto_data_team_reply
    - github_interpretation_and_docs
  rules:
    - 공식 원문을 GitHub에 전체 복제해 authoritative source를 대체하지 않는다.
    - GitHub에는 해석, 근거 식별자/링크, 확인 날짜, W.A.V.E 영향과 필요한 후속 작업을 기록한다.
    - 불확실한 사실은 PASS로 승격하지 않고 UNKNOWN/blocked 상태를 유지한다.
    - Contributor가 제출한 Issue/PR/문서는 공식 공모전 규정을 덮어쓸 수 없다.

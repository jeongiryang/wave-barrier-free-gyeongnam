version: 1
project:
  name: W.A.V.E
  repository: jeongiryang/wave-barrier-free-gyeongnam
  production_url: https://wave-barrier-free-gyeongnam.vercel.app/

authority:
  repository_owner: jeongiryang
  product_owner: jeongiryang
  pm: jeongiryang
  release_authority: jeongiryang
  contributors:
    policy: "팀원은 Issue/PR/Review를 제출할 수 있으나 제품 정책·우선순위·Release Gate를 임의 변경하지 않는다."

sources_of_truth:
  execution: github
  pm_dashboard: notion
  competition_rules:
    - official_notion
    - gmail
    - official_announcements
  product_runtime: production

agents:
  pm:
    role: "PM Assistant / Orchestrator"
    responsibilities:
      - issue_triage
      - priority_and_scope
      - competition_compliance
      - release_gate
      - cross_agent_handoff
      - notion_dashboard_sync
    prohibited:
      - override_product_owner
      - claim_human_gate_complete_without_evidence
  engineering:
    role: "Codex / Engineering Agent"
    responsibilities:
      - implement_ready_issues
      - tests
      - pull_requests
      - engineering_docs
    prohibited:
      - change_product_policy_without_issue_decision
      - bypass_required_checks
      - self_approve_final_release
  qa:
    role: "Independent QA Agent"
    responsibilities:
      - pr_validation
      - production_journey_validation
      - accessibility_validation
      - regression_detection
    prohibited:
      - mark_unverified_work_as_pass
  compliance:
    role: "Competition Compliance Agent"
    responsibilities:
      - monitor_official_sources
      - maintain_compliance_matrix
      - create_or_update_blockers
  submission:
    role: "Submission Agent"
    responsibilities:
      - readme_consistency
      - service_description
      - demo_script
      - presentation_inputs
      - submission_checklist

issue_lifecycle:
  states:
    - reported
    - triage
    - ready-for-dev
    - in-progress
    - in-review
    - ready-for-qa
    - verified
    - closed
  exceptional_states:
    - blocked-human
    - blocked-external
    - deferred
    - rejected

priorities:
  P0: "Launch/submission blocker, severe trust/security/accessibility/core-journey failure"
  P1: "Must fix before submission"
  P2: "Meaningful quality improvement"
  P3: "Polish / follow-up"

handoff:
  primary_transport: github
  rules:
    - "Issue 번호가 개발 작업의 기본 handoff token이다."
    - "PR 번호가 구현 검토/QA의 기본 handoff token이다."
    - "사람에게 프롬프트 복사·붙여넣기를 요구하는 방식은 fallback으로만 사용한다."
    - "채팅 context보다 GitHub 기록과 .wave 상태를 우선한다."

human_gates:
  - final_competition_submission
  - participant_eligibility_confirmation
  - payment_or_cost_commitment
  - destructive_external_admin_change
  - destructive_data_operation
  - legal_final_judgment
  - branch_protection_bypass

release_status:
  allowed:
    - NO_GO
    - CONDITIONAL_GO
    - GO
  default: NO_GO

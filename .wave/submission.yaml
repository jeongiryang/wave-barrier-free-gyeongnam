claims_policy:
  rules:
    - Production에서 직접 시연할 수 없는 기능은 제출자료의 현재 기능으로 쓰지 않는다.
    - 테스트 통과 수, 최신 commit, PR 번호처럼 자주 바뀌는 값은 생성 시 GitHub에서 읽고 이 파일에 고정하지 않는다.
    - KTO OpenAPI 데이터와 외부 API 데이터는 출처를 구분한다.
    - 공식 편의정보와 여행자 경험/제보를 같은 근거로 합치지 않는다.
    - 장소 편의 확인과 이동 경로 접근성 확인 범위를 같은 것으로 표현하지 않는다.
    - 미확인 정보를 없음 또는 가능으로 추정하지 않는다.
    - AI가 만든 소개문/발표문은 코드·Production·공식 규정보다 우선할 수 없다.

  <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b8d9ea"/><stop offset=".55" stop-color="#5f8d72"/><stop offset="1" stop-color="#28534d"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect width="1440" height="820" fill="url(#bg)"/>
<text x="54" y="58" fill="#fff" font-size="30" font-family="sans-serif" font-weight="700">OFF (기본 상태)</text>

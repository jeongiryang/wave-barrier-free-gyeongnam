  <rect x="752" y="92" width="640" height="520" rx="28" fill="#092033" opacity=".55"/>
  <g filter="url(#blur)" opacity=".25"><rect x="752" y="92" width="640" height="520" rx="28" fill="url(#photo)"/></g>
  <rect x="778" y="118" width="150" height="42" rx="21" fill="#dff7ff"/><text x="798" y="146" fill="#073b5b" font-size="17" font-family="sans-serif" font-weight="700">여행 이야기와 질문</text>

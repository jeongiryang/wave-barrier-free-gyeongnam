  <text x="790" y="340" fill="#fff" font-size="30" font-family="sans-serif" font-weight="700">[시연] 창녕, 단체방 투표가 더 어려웠던 이유</text>
  <text x="790" y="386" fill="#eef7fb" font-size="19" font-family="sans-serif">친구들과 창녕 여행 계획을 짜며 선택지를 투표에 올렸는데…</text>
  <text x="790" y="420" fill="#eef7fb" font-size="19" font-family="sans-serif">호버하면 상세 설명과 반응·저장 기능이 자연스럽게 나타납니다.</text>
  <rect x="790" y="470" width="70" height="38" rx="18" fill="#0c466a"/><text x="809" y="495" fill="#fff" font-size="17" font-family="sans-serif">창녕</text>
  <rect x="1110" y="480" width="236" height="64" rx="18" fill="#0a2539" stroke="#8aa9ba"/><text x="1134" y="520" fill="#fff" font-size="21" font-family="sans-serif">♡ 38     ◯ 0     ▱ 저장</text>
</g>
<text x="54" y="680" fill="#d8e9f2" font-size="23" font-family="sans-serif">OFF: 사진을 선명하게 유지하고 카테고리·날짜·지역·제목만 표시</text>
<text x="54" y="726" fill="#d8e9f2" font-size="23" font-family="sans-serif">ON: 사진 블러 + 어두운 오버레이, 본문·작성자·좋아요·댓글·북마크 표시</text>
<text x="54" y="772" fill="#9fc7d9" font-size="19" font-family="sans-serif">터치 기기는 hover가 없으므로 기존 정보 노출을 유지해 접근성을 보존합니다.</text>
